<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <script src="/static/admin/bootstrap/js/color-modes.js"></script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">
    <link href="/static/admin/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/admin/sign-in.css" rel="stylesheet">

    <style>
        .bd-placeholder-img {
            font-size: 1.125rem;
            text-anchor: middle;
            user-select: none;
        }

        @media (min-width: 768px) {
            .bd-placeholder-img-lg {
                font-size: 3.5rem;
            }
        }

        .b-example-divider {
            width: 100%;
            height: 3rem;
            background-color: rgba(0, 0, 0, .1);
            border: solid rgba(0, 0, 0, .15);
            border-width: 1px 0;
            box-shadow:
                inset 0 .5em 1.5em rgba(0, 0, 0, .1),
                inset 0 .125em .5em rgba(0, 0, 0, .15);
        }

        .b-example-vr {
            flex-shrink: 0;
            width: 1.5rem;
            height: 100vh;
        }

        .bi {
            vertical-align: -.125em;
            fill: currentColor;
        }

        .nav-scroller {
            position: relative;
            z-index: 2;
            height: 2.75rem;
            overflow-y: hidden;
        }

        .nav-scroller .nav {
            display: flex;
            flex-wrap: nowrap;
            padding-bottom: 1rem;
            margin-top: -1px;
            overflow-x: auto;
            text-align: center;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .btn-bd-primary {
            --bd-violet-bg: #712cf9;
            --bd-violet-rgb: 112.520718, 44.062154, 249.437846;

            --bs-btn-font-weight: 600;
            --bs-btn-color: var(--bs-white);
            --bs-btn-bg: var(--bd-violet-bg);
            --bs-btn-border-color: var(--bd-violet-bg);
            --bs-btn-hover-color: var(--bs-white);
            --bs-btn-hover-bg: #6528e0;
            --bs-btn-hover-border-color: #6528e0;
            --bs-btn-focus-shadow-rgb: var(--bd-violet-rgb);
            --bs-btn-active-color: var(--bs-btn-hover-color);
            --bs-btn-active-bg: #5a23c8;
            --bs-btn-active-border-color: #5a23c8;
        }

        .bd-mode-toggle {
            z-index: 1500;
        }

        .bd-mode-toggle .dropdown-menu .active .bi {
            display: block !important;
        }

        /* Login method switch */
        .login-method-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .login-method-switch button {
            flex: 1;
        }

        /* Pass-Key input */
        #passkey {
            letter-spacing: 2px;
            text-align: center;
            font-weight: 500;
        }

        .passkey-help {
            font-size: 0.85rem;
            opacity: 0.7;
            text-align: center;
            margin-top: 8px;
        }

        .login-section {
            display: none;
        }

        .login-section.active {
            display: block;
        }
    </style>
</head>


<body class="d-flex align-items-center py-4 bg-body-tertiary">

    <!-- Theme icons -->
    <svg xmlns="http://www.w3.org/2000/svg" class="d-none">

        <symbol id="check2" viewBox="0 0 16 16">
            <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708-.708z"/>
        </symbol>

        <symbol id="circle-half" viewBox="0 0 16 16">
            <path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"/>
        </symbol>

        <symbol id="moon-stars-fill" viewBox="0 0 16 16">
            <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
            <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.734 1.734 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.734 1.734 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.734 1.734 0 0 0 1.097-1.097l.387-1.162z"/>
        </symbol>

        <symbol id="sun-fill" viewBox="0 0 16 16">
            <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 0 .707z"/>
        </symbol>

    </svg>


    <!-- Theme switcher -->
    <div class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle">

        <button class="btn btn-bd-primary py-2 dropdown-toggle d-flex align-items-center"
                id="bd-theme"
                type="button"
                aria-expanded="false"
                data-bs-toggle="dropdown"
                aria-label="Toggle theme (auto)">

            <svg class="bi my-1 theme-icon-active"
                 width="1em"
                 height="1em">

                <use href="#circle-half"></use>

            </svg>

            <span class="visually-hidden">
                Toggle theme
            </span>

        </button>

        <ul class="dropdown-menu dropdown-menu-end shadow"
            aria-labelledby="bd-theme-text">

            <li>

                <button type="button"
                        class="dropdown-item d-flex align-items-center"
                        data-bs-theme-value="light">

                    <svg class="bi me-2 opacity-50"
                         width="1em"
                         height="1em">

                        <use href="#sun-fill"></use>

                    </svg>

                    Light

                </button>

            </li>

            <li>

                <button type="button"
                        class="dropdown-item d-flex align-items-center"
                        data-bs-theme-value="dark">

                    <svg class="bi me-2 opacity-50"
                         width="1em"
                         height="1em">

                        <use href="#moon-stars-fill"></use>

                    </svg>

                    Dark

                </button>

            </li>

            <li>

                <button type="button"
                        class="dropdown-item d-flex align-items-center active"
                        data-bs-theme-value="auto">

                    <svg class="bi me-2 opacity-50"
                         width="1em"
                         height="1em">

                        <use href="#circle-half"></use>

                    </svg>

                    Auto

                </button>

            </li>

        </ul>

    </div>


    <!-- Login -->
    <main class="form-signin w-100 m-auto">

        <form method="post" id="loginForm">

            <!-- Password login -->
            <div id="passwordLogin"
                 class="login-section active">

                <h1 class="h3 mb-3 fw-normal text-center">
                    Admin Login
                </h1>

                <input type="hidden"
                       name="login_method"
                       id="loginMethod"
                       value="password">


                <div class="form-floating mb-2">

                    <input type="text"
                           class="form-control"
                           id="username"
                           name="username"
                           placeholder="Username"
                           autocomplete="username">

                    <label for="username">
                        Username
                    </label>

                </div>


                <div class="form-floating mb-3">

                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Password"
                           autocomplete="current-password">

                    <label for="password">
                        Password
                    </label>

                </div>


                <button class="btn btn-primary w-100 py-2"
                        type="submit">

                    Sign in with Password

                </button>

            </div>


            <!-- Pass-Key login -->
            <div id="passkeyLogin"
                 class="login-section">

                <h1 class="h3 mb-3 fw-normal text-center">
                    Pass-Key Login
                </h1>


                <div class="form-floating mb-3">

                    <input type="password"
                           class="form-control"
                           id="passkey"
                           name="passkey"
                           placeholder="XXXXXX-XXXXXX-XXXXXX"
                           autocomplete="off">

                    <label for="passkey">
                        Pass-Key
                    </label>

                </div>


                <button type="button"
                        class="btn btn-outline-secondary w-100 mb-3"
                        onclick="togglePasskey()">

                    Show Pass-Key

                </button>


                <button class="btn btn-primary w-100 py-2"
                        type="submit">

                    Sign in with Pass-Key

                </button>


                <div class="passkey-help">

                    Enter your 18-character Pass-Key.

                    <br>

                    Format:
                    XXXXXX-XXXXXX-XXXXXX

                </div>

            </div>


            <!-- Switch login method -->
            <div class="login-method-switch mt-3">

                <button type="button"
                        class="btn btn-outline-primary"
                        id="passwordButton"
                        onclick="showPasswordLogin()">

                    Password Login

                </button>

                <button type="button"
                        class="btn btn-outline-secondary"
                        id="passkeyButton"
                        onclick="showPasskeyLogin()">

                    Pass-Key Login

                </button>

            </div>

        </form>

    </main>


    <script>

        function showPasswordLogin() {

            document
                .getElementById("passwordLogin")
                .classList
                .add("active");

            document
                .getElementById("passkeyLogin")
                .classList
                .remove("active");

            document
                .getElementById("loginMethod")
                .value = "password";

            document
                .getElementById("passwordButton")
                .classList
                .remove("btn-outline-primary");

            document
                .getElementById("passwordButton")
                .classList
                .add("btn-primary");

            document
                .getElementById("passkeyButton")
                .classList
                .remove("btn-primary");

            document
                .getElementById("passkeyButton")
                .classList
                .add("btn-outline-secondary");

        }


        function showPasskeyLogin() {

            document
                .getElementById("passwordLogin")
                .classList
                .remove("active");

            document
                .getElementById("passkeyLogin")
                .classList
                .add("active");

            document
                .getElementById("loginMethod")
                .value = "passkey";

            document
                .getElementById("passkeyButton")
                .classList
                .remove("btn-outline-secondary");

            document
                .getElementById("passkeyButton")
                .classList
                .add("btn-primary");

            document
                .getElementById("passwordButton")
                .classList
                .remove("btn-primary");

            document
                .getElementById("passwordButton")
                .classList
                .add("btn-outline-primary");

        }


        function togglePasskey() {

            const passkeyInput =
                document.getElementById("passkey");

            const button =
                event.target;


            if (passkeyInput.type === "password") {

                passkeyInput.type = "text";

                button.textContent =
                    "Hide Pass-Key";

            } else {

                passkeyInput.type = "password";

                button.textContent =
                    "Show Pass-Key";

            }

        }

    </script>


    <script src="/static/admin/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>

</html>
