<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balancer Login · Card Wars Kingdom</title>
  <link href="/static/admin/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#243b53,#101827 65%);padding:1rem}
    .login-card{width:min(100%,430px);border:1px solid #344256;border-radius:20px;background:#172235;padding:2rem;box-shadow:0 24px 70px #0005}
    .brand-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#dbeafe;color:#102039;font-size:1.4rem;font-weight:800}
    .muted{color:#aab8cb}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand-mark mb-3">B</div>
    <div class="small text-uppercase muted">Card Wars Kingdom</div>
    <h1 class="h3 mt-1 mb-2">Balancer Login</h1>
    <p class="muted mb-4">Sign in with your Balancer account username and password.</p>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/balancer/login{% if request.args.get('next') %}?next={{ request.args.get('next')|urlencode }}{% endif %}">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required autofocus maxlength="80">
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input class="form-control form-control-lg" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
    </form>
    <p class="small muted mt-4 mb-0">Contact your server administrator to create an account.</p>
  </main>
</body>
</html>
